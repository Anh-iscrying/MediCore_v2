server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  datasource:
    # URL lấy từ Supabase (Transaction Pooler - Mode: Transaction)
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Tự động tạo bảng dựa trên Entity (Dùng lúc Dev)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Cấu hình bảo mật JWT
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 86400000 # 1 ngày (ms)

# Cấu hình Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html