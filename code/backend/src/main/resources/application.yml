server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  datasource:
    # URL lấy từ Supabase PostgreSQL
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Tự động cập nhật bảng mới
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:5MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:16MB}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Cấu hình bảo mật JWT
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:86400000} # 1 ngày (ms)

jwt:
  secret: ${JWT_SECRET:change-me-before-running-very-long-secret-key-32-chars-long}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3001}
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    medical-records-bucket: ${SUPABASE_MEDICAL_RECORDS_BUCKET:medical-records}
    signed-url-ttl-seconds: ${SUPABASE_SIGNED_URL_TTL_SECONDS:900}

  mail:
    from: ${MAIL_FROM:${GMAIL_USERNAME:}}
  otp:
    secret: ${OTP_SECRET:${JWT_SECRET:change-me-before-running-very-long-secret-key-32-chars-long}}
  ai:
    base-url: ${AI_GATEWAY_BASE_URL:}
    api-key: ${AI_GATEWAY_API_KEY:}
    model: ${AI_GATEWAY_MODEL:cx/gpt-5.5}
    timeout-ms: ${AI_GATEWAY_TIMEOUT_MS:30000}
    temperature: ${AI_GATEWAY_TEMPERATURE:0.4}
    max-input-chars: ${AI_MAX_INPUT_CHARS:4000}
    max-history-messages: ${AI_MAX_HISTORY_MESSAGES:10}
    max-images-per-message: ${AI_MAX_IMAGES_PER_MESSAGE:3}
    max-image-bytes: ${AI_MAX_IMAGE_BYTES:5242880}
    allowed-image-mime-types: ${AI_ALLOWED_IMAGE_MIME_TYPES:image/png,image/jpeg,image/webp}
  appointment:
    min-hours-before-booking: ${APPOINTMENT_MIN_HOURS_BEFORE_BOOKING:0}
    min-hours-before-cancellation: ${APPOINTMENT_MIN_HOURS_BEFORE_CANCELLATION:0}
    max-active-per-patient: ${APPOINTMENT_MAX_ACTIVE_PER_PATIENT:3}
    max-created-per-patient-per-day: ${APPOINTMENT_MAX_CREATED_PER_PATIENT_PER_DAY:3}


# Cấu hình Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
