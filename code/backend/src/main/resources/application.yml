server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  datasource:
    # URL lấy từ Supabase PostgreSQL
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Tự động cập nhật bảng mới
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  # Cấu hình bảo mật JWT
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:86400000} # 1 ngày (ms)

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Cấu hình Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html